services:
   postgres:
      image: postgres:18-alpine
      ports:
         - "5432:5432"
      environment:
         POSTGRES_USER: loaner
         POSTGRES_PASSWORD: loaner
         POSTGRES_DB: loaner
      volumes:
        - pgdata:/var/lib/postgresql/data
      healthcheck:
         test: ["CMD-SHELL", "pg_isready -U tasker"]
         interval: 5s
         timeout: 5s
         retries: 5

volumes:
   pgdata:
