apiVersion: apps/v1
kind: Deployment
metadata:
  name: loaner
spec:
  replicas: 3
  selector:
    matchLabels:
      app: loaner
  template:
    metadata:
      labels:
        app: loaner
    spec:
      containers:
      - name: loaner
        image: loaner:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8080
        - containerPort: 9090
        env:
        - name: DATABASE_URL
          value: postgres://loaner:loaner@postgres:5432/loaner?sslmode=disable
        - name: HTTP_PORT
          value: "8080"
        - name: GRPC_PORT
          value: "9090"
---
apiVersion: v1
kind: Service
metadata:
  name: loaner
spec:
  type: NodePort
  selector:
    app: loaner
  ports:
  - name: http
    port: 8080
    targetPort: 8080
    nodePort: 30880
  - name: grpc
    port: 9090
    targetPort: 9090
    nodePort: 30890
